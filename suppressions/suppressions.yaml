- id: comsunxmlbindexternal-relaxng-datatyperngom-cve-2024-9329
  type: cve-triage
  notes: "file names: relaxng-datatype-4.0.8.jar, rngom-4.0.8.jar\n\n    [Issue #65] [Issue #70] These are JAXB XML schema\
    \ parsing libraries (com.sun.xml.bind.external groupId)\n    being incorrectly matched to the Eclipse GlassFish application\
    \ server CPE due to two coinciding\n    factors: (a) shared GlassFish/JAXB-RI project heritage causing the scanner to\
    \ assign\n    cpe:2.3:a:eclipse:glassfish via the parent groupId org.glassfish.jaxb, and (b) version number\n    coincidence\
    \ (library v4.0.8 vs. GlassFish application server 4.0.8).\n\n    These libraries are pure XML parsing components with\
    \ no HTTP server, admin console, or EL\n    evaluation functionality. The actually vulnerable components are exclusively\
    \ in the GlassFish\n    Administration Console (org.glassfish.main.admingui:console-common), which is not present\n  \
    \  in WildFly:\n    - CVE-2024-9329: open redirect in the GlassFish /management/domain HTTP management endpoint\n    -\
    \ CVE-2026-2586: authenticated RCE via crafted requests to the GlassFish admin console\n    - CVE-2026-2587: unauthenticated\
    \ EL injection via the GlassFish gadget handler (gadget.jsf)\n\n    https://github.com/wildfly-security/wildfly-sca-scanner/issues/65\n\
    \    https://github.com/wildfly-security/wildfly-sca-scanner/issues/70"
  match:
    package-url: ^pkg:maven/com\.sun\.xml\.bind\.external/(relaxng-datatype|rngom)@.*$
  suppress:
    cves:
    - CVE-2024-9329
    - CVE-2026-2586
    - CVE-2026-2587
  until: '2027-06-08'
  references:
  - https://github.com/wildfly-security/wildfly-sca-scanner/issues/65
  - https://github.com/wildfly-security/wildfly-sca-scanner/issues/70
- id: ionetty-netty-codec-http3-cve-2026-42582
  type: cve-triage
  notes: "file name: netty-*.jar\n\n    [Issue #66] CVE-2026-42582 affects only io.netty:netty-codec-http3 (the HTTP/3 QPACK\
    \ decoder),\n    which exists only in the Netty 4.2.x branch. WildFly ships Netty 4.1.x and netty-codec-http3\n    is\
    \ entirely absent from the distribution. The scanner attributes the CVE to all Netty jars at\n    version 4.1.133.Final\
    \ because NVD CPEs are product-level, not module-level.\n\n    The packageUrl regex explicitly excludes netty-codec-http3\
    \ so that if WildFly ever adds HTTP/3\n    support this suppression will not hide a real finding.\n\n    https://github.com/wildfly-security/wildfly-sca-scanner/issues/66"
  match:
    package-url: ^pkg:maven/io\.netty/(?!netty-codec-http3).*@.*$
  suppress:
    cves:
    - CVE-2026-42582
  until: '2027-05-20'
  references:
  - https://github.com/wildfly-security/wildfly-sca-scanner/issues/66
- id: wildfly-bin-client-jboss-client-jar-cve-2026-42582
  type: cve-triage
  notes: "file name: jboss-client.jar\n\n    [Issue #66] jboss-client.jar shades netty-transport-native-epoll:4.1.133.Final.\
    \ CVE-2026-42582\n    affects only netty-codec-http3 (4.2.x only), which is not present in WildFly. Suppressed via\n \
    \   filePath as the shaded jar has no resolvable purl for the embedded Netty dependency.\n\n    https://github.com/wildfly-security/wildfly-sca-scanner/issues/66"
  match:
    file-path: ^.*/wildfly/bin/client/jboss-client\.jar$
  suppress:
    cves:
    - CVE-2026-42582
  until: '2027-05-20'
  references:
  - https://github.com/wildfly-security/wildfly-sca-scanner/issues/66
