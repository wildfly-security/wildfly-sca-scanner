# Canonical vulnerability suppression rules
# Source of truth — scanner-specific formats are generated from this file.
# Migrated from owasp-suppressions/owasp-suppressions.xml

version: '1.0'
suppressions:
- id: cpe-orgwildflyinstallation-manager-installation-manager-api-
  type: cpe-correction
  notes: "file name: installation-manager-api-1.2.1.Final.jar\n\n      WildFly Installation Manager API is being incorrectly\
    \ mapped to multiple unrelated products:\n      - IBM Installation Manager (CVE-2009-3518)\n      - IBM Rational ClearCase\
    \ (CVE-2014-6134)\n      - Red Hat Developer Hub (CVE-2023-6944)\n\n      The POM contains developer metadata pointing\
    \ to IBM (developer org), and the version number (1.2.1)\n      matches RHDH versions, causing the scanner to incorrectly\
    \ associate this with these products.\n      This is WildFly's own installation manager API, not IBM or RHDH products."
  match:
    package-url: ^pkg:maven/org\.wildfly\.installation\-manager/installation\-manager\-api@.*$
  suppress:
    cpes:
    - cpe:/a:ibm:installation_manager
    - cpe:/a:ibm:rational_clearcase
    - cpe:/a:redhat:red_hat_developer_hub
- id: cpe-iogrpc-grpc-api-grpc
  type: cpe-correction
  notes: "file name: grpc-api-1.70.0.jar\n\n      WildFly uses the Java gRPC library (pkg:maven/io.grpc/grpc-api) which should\
    \ not be mapped to\n      gRPC-Go CPEs. The Java and Go implementations are separate codebases with different vulnerabilities.\n\
    \n      Suppressing: cpe:2.3:a:grpc:grpc:*:*:*:*:*:go:*:* (note the :go: platform indicator)"
  match:
    package-url: ^pkg:maven/io\.grpc/grpc-api@.*$
  suppress:
    cpes:
    - cpe:/a:grpc:grpc
- id: cpe-ioopentelemetry-opentelemetry
  type: cpe-correction
  notes: "file name: opentelemetry-proto-1.5.0-alpha.jar, opentelemetry-semconv-1.32.0.jar, etc.\n\n      WildFly uses Java\
    \ OpenTelemetry libraries (pkg:maven/io.opentelemetry.*) which should not be mapped to\n      OpenTelemetry-Go CPEs. The\
    \ Java and Go implementations are separate codebases with different vulnerabilities.\n\n      Suppressing: cpe:2.3:a:opentelemetry:opentelemetry:*:*:*:*:*:go:*:*\
    \ (note the :go: platform indicator)"
  match:
    package-url: ^pkg:maven/io\.opentelemetry\..*@.*$
  suppress:
    cpes:
    - cpe:/a:opentelemetry:opentelemetry
- id: cpe-micrometer-registry-prometheus-jar-prometheus
  type: cpe-correction
  notes: "file name: micrometer-registry-prometheus-*.jar\n\n      [Issue #64] WildFly uses io.micrometer:micrometer-registry-prometheus,\
    \ a Java metrics client\n      library, which is being incorrectly mapped to the Prometheus server CPE\n      (cpe:2.3:a:prometheus:prometheus).\
    \ These are entirely separate projects: Micrometer is a Java\n      metrics facade (io.micrometer groupId), while the\
    \ Prometheus server is a Go binary\n      (github.com/prometheus/prometheus). The scanner falls back to CPE-based version\
    \ matching for\n      this jar because it has no resolved purl, causing accidental version number matches against\n  \
    \    the Prometheus server CPE.\n\n      https://github.com/wildfly-security/wildfly-sca-scanner/issues/64"
  match:
    file-path: .*micrometer-registry-prometheus-.*\.jar
  suppress:
    cpes:
    - cpe:/a:prometheus:prometheus
  references:
  - https://github.com/wildfly-security/wildfly-sca-scanner/issues/64
